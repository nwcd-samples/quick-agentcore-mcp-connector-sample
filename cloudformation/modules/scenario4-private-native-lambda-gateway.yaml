AWSTemplateFormatVersion: '2010-09-09'
Description: Scenario 4 AgentCore MCP Gateway for two dedicated VPC Lambda targets.

Parameters:
  Prefix:
    Type: String
    AllowedPattern: '^[a-z][a-z0-9-]{2,30}$'
  OrderLambdaArn:
    Type: String
    AllowedPattern: '^arn:[^:]+:lambda:[^:]+:[0-9]{12}:function:[A-Za-z0-9-_]+(?::[^:]+)?$'
  InventoryLambdaArn:
    Type: String
    AllowedPattern: '^arn:[^:]+:lambda:[^:]+:[0-9]{12}:function:[A-Za-z0-9-_]+(?::[^:]+)?$'
  DiscoveryUrl:
    Type: String
    AllowedPattern: '^https://.+/\.well-known/openid-configuration$'
  AllowedClientId:
    Type: String
    MinLength: 1
  AllowedScope:
    Type: String
    MinLength: 1

Resources:
  GatewayRole:
    Type: AWS::IAM::Role
    Properties:
      Description: !Sub '${Prefix} Scenario 4 role; invoke only dedicated VPC Lambdas'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: bedrock-agentcore.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
              ArnLike:
                aws:SourceArn: !Sub 'arn:${AWS::Partition}:bedrock-agentcore:${AWS::Region}:${AWS::AccountId}:gateway/*'
      Policies:
        - PolicyName: InvokeOnlyScenario4VpcBusinessTools
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: InvokeOnlyScenario4OrderAndInventory
                Effect: Allow
                Action: lambda:InvokeFunction
                Resource:
                  - !Ref OrderLambdaArn
                  - !Ref InventoryLambdaArn
      Tags:
        - Key: Project
          Value: quick-agentcore-security-blog
        - Key: Scenario
          Value: private-link

  Gateway:
    Type: AWS::BedrockAgentCore::Gateway
    Properties:
      Name: !Sub '${Prefix}-gateway'
      Description: Scenario 4 private MCP and auth paths with VPC business Lambdas
      RoleArn: !GetAtt GatewayRole.Arn
      ProtocolType: MCP
      AuthorizerType: CUSTOM_JWT
      AuthorizerConfiguration:
        CustomJWTAuthorizer:
          DiscoveryUrl: !Ref DiscoveryUrl
          AllowedClients:
            - !Ref AllowedClientId
          AllowedScopes:
            - !Ref AllowedScope
      Tags:
        Project: quick-agentcore-security-blog
        Scenario: private-link

  OrderTarget:
    Type: AWS::BedrockAgentCore::GatewayTarget
    Properties:
      GatewayIdentifier: !GetAtt Gateway.GatewayIdentifier
      Name: !Sub '${Prefix}-order-requirements'
      Description: Scenario 4 read-only order requirements in customer VPC
      TargetConfiguration:
        Mcp:
          Lambda:
            LambdaArn: !Ref OrderLambdaArn
            ToolSchema:
              InlinePayload:
                - Name: get_order_requirements
                  Description: >-
                    Always call this read-only tool first. It returns complete
                    aggregated requirements and a handoff checksum.
                  InputSchema:
                    Type: object
                    Properties:
                      order_id:
                        Type: string
                        Description: Order identifier such as ORDER-1001
                    Required:
                      - order_id
      CredentialProviderConfigurations:
        - CredentialProviderType: GATEWAY_IAM_ROLE

  InventoryTarget:
    Type: AWS::BedrockAgentCore::GatewayTarget
    Properties:
      GatewayIdentifier: !GetAtt Gateway.GatewayIdentifier
      Name: !Sub '${Prefix}-inventory-availability'
      Description: Scenario 4 inventory evaluation in customer VPC
      TargetConfiguration:
        Mcp:
          Lambda:
            LambdaArn: !Ref InventoryLambdaArn
            ToolSchema:
              InlinePayload:
                - Name: check_inventory_availability
                  Description: >-
                    Call only after get_order_requirements succeeds and pass
                    order_id, requirements, and checksum unchanged.
                  InputSchema:
                    Type: object
                    Properties:
                      order_id:
                        Type: string
                      requirements:
                        Type: array
                        Items:
                          Type: object
                          Properties:
                            sku:
                              Type: string
                            warehouse_id:
                              Type: string
                            required_quantity:
                              Type: integer
                          Required:
                            - sku
                            - warehouse_id
                            - required_quantity
                      requirements_checksum:
                        Type: string
                    Required:
                      - order_id
                      - requirements
                      - requirements_checksum
      CredentialProviderConfigurations:
        - CredentialProviderType: GATEWAY_IAM_ROLE

Outputs:
  GatewayArn:
    Value: !GetAtt Gateway.GatewayArn
  GatewayIdentifier:
    Value: !GetAtt Gateway.GatewayIdentifier
  GatewayUrl:
    Value: !GetAtt Gateway.GatewayUrl
  GatewayRoleArn:
    Value: !GetAtt GatewayRole.Arn
  OrderTargetId:
    Value: !GetAtt OrderTarget.TargetId
  InventoryTargetId:
    Value: !GetAtt InventoryTarget.TargetId
