Transform: AWS::Serverless-2016-10-31
Description: >-
  Update-safe mixed business APIs for Scenario 2: a legacy Basic-auth Order
  REST API and an Entra app-only Inventory HTTP API with native JWT validation.

Parameters:
  Prefix:
    Type: String
    AllowedPattern: '^[a-z][a-z0-9-]{2,20}$'
  OrderBasicAuthToolLambdaArn:
    Type: String
    AllowedPattern: '^arn:[^:]+:lambda:[^:]+:[0-9]{12}:function:order-basic-auth-tool(?::[^:]+)?$'
  InventoryToolLambdaArn:
    Type: String
    AllowedPattern: '^arn:[^:]+:lambda:[^:]+:[0-9]{12}:function:inventory-tool(?::[^:]+)?$'
  EntraTenantId:
    Type: String
    AllowedPattern: '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$'
  InventoryApiApplicationId:
    Type: String
    AllowedPattern: '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$'
  InventoryClientApplicationId:
    Type: String
    AllowedPattern: '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$'
  InventoryAppRole:
    Type: String
    Default: InventoryReader
    AllowedValues:
      - InventoryReader
  StageName:
    Type: String
    Default: prod
    AllowedPattern: '^[a-zA-Z0-9_-]+$'

Resources:
  OrderRestApi:
    Type: AWS::Serverless::Api
    Properties:
      Name: !Sub '${Prefix}-order-basic-api'
      Description: Legacy order Basic-auth boundary
      StageName: !Ref StageName
      OpenApiVersion: 3.0.1
      Mode: overwrite
      EndpointConfiguration:
        Type: REGIONAL
      DisableExecuteApiEndpoint: false
      TracingEnabled: true
      Tags:
        Project: quick-agentcore-security-blog
        Scenario: mixed-auth
      DefinitionBody:
        openapi: 3.0.1
        info:
          title: Scenario 2 Order Basic API
          version: '1.0'
        paths:
          /order-requirements:
            post:
              operationId: get_order_requirements
              summary: Get complete aggregated order requirements
              requestBody:
                required: true
                content:
                  application/json:
                    schema:
                      type: object
                      additionalProperties: false
                      required:
                        - order_id
                      properties:
                        order_id:
                          type: string
                          pattern: '^ORDER-[A-Z0-9-]{1,32}$'
                          minLength: 7
                          maxLength: 38
              responses:
                '200':
                  description: Order result
                '400':
                  description: Invalid input
                '401':
                  description: Missing or invalid Basic credentials
                '403':
                  description: Authenticated account is not allowed
              x-amazon-apigateway-integration:
                type: aws_proxy
                httpMethod: POST
                uri: !Sub
                  - 'arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${FunctionArn}/invocations'
                  - FunctionArn: !Ref OrderBasicAuthToolLambdaArn
                timeoutInMillis: 10000

  OrderLambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref OrderBasicAuthToolLambdaArn
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceAccount: !Ref AWS::AccountId
      SourceArn: !Sub 'arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${OrderRestApi}/${StageName}/POST/order-requirements'

  InventoryHttpApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: !Sub '${Prefix}-inventory-entra-api'
      Description: Inventory API protected by Entra app-only access tokens
      ProtocolType: HTTP
      DisableExecuteApiEndpoint: false
      Tags:
        Project: quick-agentcore-security-blog
        Scenario: mixed-auth

  InventoryIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref InventoryHttpApi
      IntegrationType: AWS_PROXY
      IntegrationMethod: POST
      IntegrationUri: !Ref InventoryToolLambdaArn
      PayloadFormatVersion: '2.0'
      TimeoutInMillis: 10000

  InventoryJwtAuthorizer:
    Type: AWS::ApiGatewayV2::Authorizer
    Properties:
      ApiId: !Ref InventoryHttpApi
      Name: !Sub '${Prefix}-inventory-entra-jwt'
      AuthorizerType: JWT
      IdentitySource:
        - $request.header.Authorization
      JwtConfiguration:
        Audience:
          - !Ref InventoryApiApplicationId
        Issuer: !Sub 'https://login.microsoftonline.com/${EntraTenantId}/v2.0'

  InventoryRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref InventoryHttpApi
      RouteKey: POST /inventory-availability
      AuthorizationType: JWT
      AuthorizerId: !Ref InventoryJwtAuthorizer
      Target: !Sub 'integrations/${InventoryIntegration}'

  InventoryStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref InventoryHttpApi
      StageName: !Ref StageName
      AutoDeploy: true
      StageVariables:
        authorizationMode: ENTRA_APP_ONLY
        expectedTenantId: !Ref EntraTenantId
        expectedClientId: !Ref InventoryClientApplicationId
        requiredAppRole: !Ref InventoryAppRole
      Tags:
        Project: quick-agentcore-security-blog
        Scenario: mixed-auth

  InventoryLambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref InventoryToolLambdaArn
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceAccount: !Ref AWS::AccountId
      SourceArn: !Sub 'arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${InventoryHttpApi}/${StageName}/POST/inventory-availability'

Outputs:
  OrderApiId:
    Value: !Ref OrderRestApi
  OrderApiBaseUrl:
    Value: !Sub 'https://${OrderRestApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/${StageName}'
  InventoryApiId:
    Value: !Ref InventoryHttpApi
  InventoryApiBaseUrl:
    Value: !Sub 'https://${InventoryHttpApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/${StageName}'
  InventoryJwtAuthorizerId:
    Value: !Ref InventoryJwtAuthorizer
