AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Scenario 4 dedicated order and inventory Lambdas inside the VPC.

Parameters:
  Prefix:
    Type: String
    AllowedPattern: '^[a-z][a-z0-9-]{2,20}$'
  SubnetAId:
    Type: AWS::EC2::Subnet::Id
  SubnetBId:
    Type: AWS::EC2::Subnet::Id
  BusinessLambdaSecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id

Resources:
  OrderLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${Prefix}-order-vpc-tool'
      RetentionInDays: 14
      Tags:
        - Key: Project
          Value: quick-agentcore-security-blog
        - Key: Scenario
          Value: private-link

  InventoryLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${Prefix}-inventory-vpc-tool'
      RetentionInDays: 14
      Tags:
        - Key: Project
          Value: quick-agentcore-security-blog
        - Key: Scenario
          Value: private-link

  BusinessLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      Description: Scenario 4 VPC business Lambda runtime role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
      Policies:
        - PolicyName: Scenario4VpcBusinessRuntime
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: WriteOnlyOwnLogs
                Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource:
                  - !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:${OrderLogGroup}:*'
                  - !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:${InventoryLogGroup}:*'
              - Sid: ManageVpcNetworkInterfaces
                Effect: Allow
                Action:
                  - ec2:CreateNetworkInterface
                  - ec2:DescribeNetworkInterfaces
                  - ec2:DescribeSubnets
                  - ec2:DeleteNetworkInterface
                  - ec2:AssignPrivateIpAddresses
                  - ec2:UnassignPrivateIpAddresses
                Resource: '*'
      Tags:
        - Key: Project
          Value: quick-agentcore-security-blog
        - Key: Scenario
          Value: private-link

  OrderFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${Prefix}-order-vpc-tool'
      Description: Scenario 4 dedicated read-only order tool inside the VPC
      CodeUri: ../../gateway/QuickTwoToolDemo/order_requirements/
      Handler: lambda_function.lambda_handler
      Runtime: python3.12
      Architectures:
        - x86_64
      Role: !GetAtt BusinessLambdaRole.Arn
      Timeout: 10
      MemorySize: 128
      VpcConfig:
        SubnetIds:
          - !Ref SubnetAId
          - !Ref SubnetBId
        SecurityGroupIds:
          - !Ref BusinessLambdaSecurityGroupId
      LoggingConfig:
        LogFormat: JSON
        ApplicationLogLevel: INFO
        SystemLogLevel: WARN
        LogGroup: !Ref OrderLogGroup
      Tags:
        Project: quick-agentcore-security-blog
        Scenario: private-link
        Component: vpc-business-lambda

  InventoryFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${Prefix}-inventory-vpc-tool'
      Description: Scenario 4 dedicated read-only inventory tool inside the VPC
      CodeUri: ../../gateway/QuickTwoToolDemo/inventory_availability/
      Handler: lambda_function.lambda_handler
      Runtime: python3.12
      Architectures:
        - x86_64
      Role: !GetAtt BusinessLambdaRole.Arn
      Timeout: 10
      MemorySize: 128
      VpcConfig:
        SubnetIds:
          - !Ref SubnetAId
          - !Ref SubnetBId
        SecurityGroupIds:
          - !Ref BusinessLambdaSecurityGroupId
      LoggingConfig:
        LogFormat: JSON
        ApplicationLogLevel: INFO
        SystemLogLevel: WARN
        LogGroup: !Ref InventoryLogGroup
      Tags:
        Project: quick-agentcore-security-blog
        Scenario: private-link
        Component: vpc-business-lambda

Outputs:
  OrderLambdaArn:
    Value: !GetAtt OrderFunction.Arn
  OrderLambdaName:
    Value: !Ref OrderFunction
  InventoryLambdaArn:
    Value: !GetAtt InventoryFunction.Arn
  InventoryLambdaName:
    Value: !Ref InventoryFunction
